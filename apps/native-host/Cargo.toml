[package]
name = "osm-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
osm-browser-link = { path = "../../crates/browser-link" }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
zeroize = "1.8.2"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
osm-vault-browser = { path = "../../crates/vault-browser" }
osm-vault-core = { path = "../../crates/vault-core" }
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
