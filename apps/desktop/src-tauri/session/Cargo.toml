[package]
name = "osm-desktop-session"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "What the desktop app needs from the system that Tauri does not give it"

# This crate holds the desktop app's only `unsafe` calls: registering for
# the system's notifications, and asking the system to check the owner.
# Everything else here is safe Rust.

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString", "NSArray", "NSRunLoop", "NSDate"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSPasteboard", "NSPasteboardItem"] }
# The owner's check for a passkey: Touch ID, or the Mac's password.
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

# logind over D-Bus, through the libdbus binding the windowing already
# links on Linux; and a clipboard this process keeps serving. Under a
# Wayland compositor that offers the data-control protocol (wlroots, KDE)
# the clipboard is set there: through Xwayland, Wayland programs were not
# given what the app copied. Elsewhere, as on GNOME, it goes through X11.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
dbus = "0.9.12"
getrandom = "0.3.4"
sha2 = "0.10.9"
zeroize = "1.8.2"

# On Windows, exclude copied secrets from clipboard monitoring, local history,
# and cloud sync, and clear them by keyed digest on timeout or lock.
[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.6.1"
getrandom = "0.3.4"
sha2 = "0.10.9"
zeroize = "1.8.2"

[[test]]
name = "system_notifications"
harness = false
