[package]
name = "open-secret-manager"
version = "0.1.0"
description = "Owner-controlled local vault desktop shell"
authors = ["Open Secret Manager contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "open_secret_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
osm-vault-core = { path = "../../../crates/vault-core" }
osm-vault-membership = { path = "../../../crates/vault-membership" }
osm-vault-peer = { path = "../../../crates/vault-peer" }
osm-vault-sync = { path = "../../../crates/vault-sync" }
tokio = { version = "1.53.1", features = ["macros", "net", "sync", "time"] }
zeroize = "1.8"
arboard = "3.4"
# A phone's invitation is shown as a QR code too.
qrcodegen = "1.8.0"
# Held below 2.8, which needs a newer Tauri than the one locked here.
tauri-plugin-dialog = "~2.7.1"
osm-desktop-session = { path = "session" }
# The TLS key is sealed under a key the system's keystore keeps.
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
getrandom = "0.3.4"
keyring = "3.6.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

# The Secret Service over the libdbus the windowing already links, with
# the secret sent encrypted on the session bus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

# Browsers reach the app over a Unix socket.
[target.'cfg(unix)'.dependencies]
osm-browser-link = { path = "../../../crates/browser-link" }
osm-vault-browser = { path = "../../../crates/vault-browser" }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", default-features = false }
tauri = { version = "2.0.0", features = ["test"] }
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = ["io-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"

# Tauri bundles platform-specific dependencies and is checked separately from
# the UI-independent Rust workspace. The session crate holds what the app
# needs from macOS directly, and the one `unsafe` call that takes.
[workspace]
members = ["session"]
