[package]
name = "osm-vault-membership"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
openraft = { version = "0.9.25", default-features = false, features = ["serde", "storage-v2"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.24.0"
