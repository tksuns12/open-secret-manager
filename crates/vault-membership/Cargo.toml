[package]
name = "osm-vault-membership"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
openraft = { version = "0.9.25", default-features = false, features = ["serde", "storage-v2"] }
osm-vault-sync = { path = "../vault-sync" }
rusqlite = { version = "0.41.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# SQLite is built in, except on iOS, which has its own: an app there links
# it (`-lsqlite3`), so that its calls need no privacy declaration (see
# docs/release.md).
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3.24.0"
