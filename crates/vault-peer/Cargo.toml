[package]
name = "osm-vault-peer"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true

[lints]
workspace = true

[dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
getrandom = "0.3.4"
if-addrs = "0.13"
osm-vault-core = { path = "../vault-core" }
osm-vault-membership = { path = "../vault-membership" }
osm-vault-sync = { path = "../vault-sync" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring", "zeroize"] }
rusqlite = { version = "0.40.2", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
socket2 = "0.6.5"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
zeroize = { version = "1.8.2", features = ["derive"] }

# SQLite is built in, except on iOS, which has its own: an app there links
# it (`-lsqlite3`), so that its calls need no privacy declaration (see
# docs/release.md).
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
openraft = { version = "0.9.25", default-features = false, features = ["serde", "storage-v2"] }
tempfile = "3.24.0"
