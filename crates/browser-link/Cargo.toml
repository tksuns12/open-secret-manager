[package]
name = "osm-browser-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Release builds allow only the signed Chrome Web Store extension ID; enable
# this feature (or run a debug build) to also allow the unpacked dev ID.
allow-unpacked-chromium = []

[dependencies]
osm-origin = { path = "../origin" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
dirs = "6.0"
osm-unix-peer-cred = { path = "../unix-peer-cred" }
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.3"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt"] }
tempfile = "3.24.0"

[target.'cfg(windows)'.dependencies]
dirs = "6.0"
getrandom = "0.3"
hmac = "0.12.1"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util"] }
