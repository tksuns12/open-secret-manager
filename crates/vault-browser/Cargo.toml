[package]
name = "osm-vault-browser"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true

[lints]
workspace = true

[dependencies]
# For osm-fill only, which names passkeys by their credential IDs.
base64ct = { version = "1.8.3", features = ["alloc"] }
osm-browser-link = { path = "../browser-link" }
osm-vault-core = { path = "../vault-core" }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.24.0"
