[package]
name = "osm-vault-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
csv = "1.4.0"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
hmac = "0.12.1"
osm-origin = { path = "../origin" }
# Passkeys: ES256 keys and signatures, and the public suffix list for the
# sites a passkey may be for.
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
psl = "2.1.244"
rand = "0.8.5"
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
url = "2.5.8"
zeroize = { version = "1.8.2", features = ["derive"] }

# SQLite is built in, except on iOS, which has its own: an app there links
# it (`-lsqlite3`), so that its calls need no privacy declaration (see
# docs/release.md).
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3.24.0"
