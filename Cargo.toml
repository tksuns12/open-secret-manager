[workspace]
resolver = "2"
members = [
    "crates/origin",
    "crates/browser-link",
    "crates/vault-core",
    "crates/vault-browser",
    "crates/vault-sync",
    "crates/vault-peer",
    "crates/vault-membership",
    "apps/native-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
