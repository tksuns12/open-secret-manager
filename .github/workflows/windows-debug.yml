# Temporary: runs only the tests being fixed, for a quicker answer.
name: Windows debug
on:
  push:
    branches: [windows-ci]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - name: Desktop library tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
      - name: Desktop program builds
        if: always()
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
