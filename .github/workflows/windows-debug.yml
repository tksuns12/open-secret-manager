# Temporary: runs only the tests being fixed, for a quicker answer.
name: Windows debug
on:
  push:
    branches: [windows-ci]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - name: Desktop library tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
      - name: The test that failed, alone, twice
        if: always()
        shell: bash
        run: |
          for i in 1 2; do
            cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked a_removed_devices_writes -- --nocapture 2>&1 | tail -15
          done
      - name: Desktop program builds
        if: always()
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
  relay-loop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the join tests
        run: cargo test -p osm-mobile --locked --test join --no-run
      - name: All the join tests together, three times, with the trace
        shell: bash
        run: |
          for i in 1 2 3; do
            cargo test -p osm-mobile --locked --test join -- --nocapture > "all-$i.log" 2>&1 || grep -E "TRACE|FAILED|panicked|Network" "all-$i.log" | grep -v "RelayAbsent\|no address is known" | head -40
          done
