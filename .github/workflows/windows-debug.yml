# Temporary: finds why one desktop test fails on Windows.
name: Windows debug
on:
  push:
    branches: [windows-ci]
permissions:
  contents: read
jobs:
  desktop-one:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - name: The test alone, twice
        shell: bash
        run: |
          for i in 1 2; do
            cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked a_removed_devices_writes -- --nocapture 2>&1 | grep -E "DEBUG|panicked|test result|never saw|left:|right:|CommandError" | cut -c1-2500
            echo "=== round $i done"
          done
