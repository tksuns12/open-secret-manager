# The only place this project's code is built and run on Windows. The rest
# is checked by scripts/check.sh on the maintainer's machines.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      # Pin the Rust toolchain to match packaging/linux/Dockerfile and release builds.
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0 && rustc --version && cargo --version
      # The desktop crate embeds the built window.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: apps/desktop
      - name: Shared crates
        run: cargo test --workspace --locked --no-fail-fast
      - name: Desktop app
        if: always()
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --locked --no-fail-fast
      # The host as the installer ships it: built alone, so that no other
      # crate's features are added to its own, as the workspace's test build adds them.
      - name: Native host, built alone
        if: always()
        run: cargo build --release --locked -p osm-native-host
