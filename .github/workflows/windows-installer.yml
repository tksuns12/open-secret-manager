# Builds the desktop app's Windows installer on request, for someone with a
# Windows machine to try. Not a release: unsigned (Windows SmartScreen will
# warn), and not yet run against a real browser. The installer is kept as a
# run artifact for a week.
name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustc --version && cargo --version
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      # NSIS: an installer for the signed-in user alone, which needs no
      # administrator. The native messaging host is bundled beside the app.
      - run: npm run tauri:build -- --bundles nsis
        working-directory: apps/desktop
      - run: Get-ChildItem -Recurse target/release/bundle -Filter *.exe | Select-Object FullName, Length
        working-directory: apps/desktop/src-tauri
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-secret-manager-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
