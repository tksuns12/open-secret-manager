# Builds the desktop app's Windows installer on request: for someone with a
# Windows machine to try, and for a release (run it on the release's tag,
# `gh workflow run windows-installer.yml --ref desktop-v<version>`). Not
# signed: Windows SmartScreen warns. The installer, its SHA-256 and what built
# it are kept as a run artifact for a week; a release takes them from there.
name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustc --version && cargo --version
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      # NSIS: an installer for the signed-in user alone, which needs no
      # administrator. The native messaging host is bundled beside the app.
      - run: npm run tauri:build -- --bundles nsis
        working-directory: apps/desktop
      # The installer under the name a release gives it, with its SHA-256 (as
      # `shasum -a 256` prints it) and what built it.
      - name: Name it, sum it, and record what built it
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $built = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe
          if ($built.Count -ne 1) { throw "expected one installer, found $($built.Count)" }
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "Open-Secret-Manager-$version-windows-x64-setup.exe"
          Copy-Item $built[0].FullName "out/$name"
          $sum = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/out/SHA256SUMS", "$sum  $name`n")
          $info = @(
            "commit: $env:GITHUB_SHA",
            "ref: $env:GITHUB_REF",
            "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "runner image: $env:ImageOS $env:ImageVersion",
            "rustc: $(rustc --version)",
            "cargo: $(cargo --version)",
            "node: $(node --version)",
            "sha256: $sum  $name"
          )
          [System.IO.File]::WriteAllText("$PWD/out/build-info-windows.txt", ($info -join "`n") + "`n")
          Get-Content out/build-info-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-secret-manager-windows-installer
          path: out/*
          if-no-files-found: error
          retention-days: 7
